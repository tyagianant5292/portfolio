name: Build & Push Docker Images

# Builds the frontend and backend images and pushes them to Docker Hub.
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME = tyagianant98
#   DOCKERHUB_TOKEN    = a Docker Hub access token (not your password)

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/docker-build-push.yml"
  workflow_dispatch: {}

env:
  REGISTRY: docker.io
  FRONTEND_IMAGE: tyagianant98/portfolio-frontend
  BACKEND_IMAGE: tyagianant98/portfolio-backend
  # NEXT_PUBLIC_* is baked at build time — point the frontend at the Render API.
  NEXT_PUBLIC_API_URL: https://anant-portfolio-api.onrender.com
  # Run JS-based actions on Node 24 (silences the Node 20 deprecation warning).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: ./frontend
            image: tyagianant98/portfolio-frontend
          - name: backend
            context: ./backend
            image: tyagianant98/portfolio-backend
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
