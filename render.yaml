# Render Blueprint — deploys the contact-form API.
# Push this repo to GitHub, then in Render: New → Blueprint → select this repo.
# Secrets (SMTP_PASS) are added in the Render dashboard, not here.
services:
  - type: web
    name: anant-portfolio-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: PORT
        value: 4000
      - key: ALLOWED_ORIGINS
        value: https://anant-portfolio.vercel.app,http://localhost:3000
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: tyagianant98@gmail.com
      - key: MAIL_TO
        value: tyagianant98@gmail.com
      - key: MAIL_FROM
        value: tyagianant98@gmail.com
      # Set this as a secret in the Render dashboard (sync: false keeps it out of git).
      - key: SMTP_PASS
        sync: false
